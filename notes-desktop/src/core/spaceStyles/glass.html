*{box-sizing:border-box}body{margin:0;width:1200px;height:900px;font-family:Inter,"Noto Sans SC",sans-serif;color:#f2f2f2;-webkit-font-smoothing:antialiased;position:relative;overflow:hidden;
background:radial-gradient(900px 700px at 90% 0%,#2a2a2a,transparent 60%),radial-gradient(700px 600px at 0% 100%,#202020,transparent 60%),#111}
.ring{position:absolute;left:60px;top:-140px;width:1080px;height:1080px;border-radius:50%;border:1.5px solid rgba(255,255,255,.12)}
.g{position:absolute;inset:60px 64px;display:grid;grid-template-columns:1fr 1fr 1fr;grid-template-rows:360px 360px;gap:34px}
.c{border-radius:30px;padding:30px;position:relative;background:linear-gradient(160deg,rgba(255,255,255,.10),rgba(255,255,255,.03) 45%,rgba(255,255,255,.05));box-shadow:inset 0 1px 0 rgba(255,255,255,.12),inset 0 0 0 1px rgba(255,255,255,.07),0 20px 40px rgba(0,0,0,.35);backdrop-filter:blur(20px)}

.val{position:absolute;left:30px;bottom:30px}.v{font-size:38px;letter-spacing:-.02em;display:flex;align-items:center;gap:14px}.v small{font-size:22px;color:#bbb;margin-left:-8px}
.chip{font-size:20px;padding:6px 12px;border-radius:9px;display:flex;align-items:center;gap:6px}
.cap{font-size:19px;margin-top:12px}
.plus{position:absolute;right:30px;bottom:30px;width:58px;height:58px;border-radius:50%;background:rgba(255,255,255,.07);display:grid;place-items:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
.plus:before,.plus:after{content:"";position:absolute;width:24px;height:2px;background:#bbb;border-radius:2px}.plus:after{transform:rotate(90deg)}
.w{grid-column:span 2}
</style>

  <div class=val><div class=v>4/7<span class=chip style="background:rgba(40,200,80,.15);color:#2bd45a">↗ 1 次</span></div><div class=cap style="color:#2bc34f">比上周多练一次</div></div><div class=plus></div></div>

<script>
document.getElementById("dots").innerHTML=Array.from({length:7},(_,i)=>i<4?`<svg width=40 height=40 viewBox="0 0 40 40"><defs><radialGradient id=d${i} cx=.4 cy=.35><stop offset=0 stop-color=#1fbf3c /><stop offset=1 stop-color=#0c6b1e /></radialGradient></defs><circle cx=20 cy=20 r=19 fill=url(#d${i}) /><path d="M13 20l5 5 9-10" stroke=#062b0c stroke-width=2.6 fill=none stroke-linecap=round /></svg>`:`<span style="width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.06)"></span>`).join("");
// dial: center (260,330) r=240 ring, arc from angle for 23:00 to 06:30 on a 24h-ish top arc spanning 20..08 (12h over 180deg)
const cx=260,cy=345,R=225;let s=`<defs><linearGradient id=ga x1=0 x2=1><stop offset=0 stop-color=#1a9a2a /><stop offset=.5 stop-color=#2fdc3f /><stop offset=1 stop-color=#1ea52e /></linearGradient><filter id=gl x=-50% y=-50% width=200% height=200%><feGaussianBlur stdDeviation=10 /></filter><pattern id=hatch width=8 height=8 patternUnits=userSpaceOnUse patternTransform="rotate(35)"><rect width=8 height=8 fill=transparent /><rect width=3 height=8 fill=rgba(0,0,0,.18) /></pattern></defs>`;
s+=`<circle cx=${cx} cy=${cy} r=${R+18} fill=none stroke=rgba(255,255,255,.06) stroke-width=40 />`;
const ang=h=>Math.PI+(((h-20+24)%24)/12)*Math.PI; // 20h at left, 08h at right
const pt=(a,r)=>[cx+Math.cos(a)*r,cy+Math.sin(a)*r];
for(let i=0;i<=48;i++){const a=Math.PI+i/48*Math.PI;const big=i%8==0;const [x1,y1]=pt(a,R-36),[x2,y2]=pt(a,R-36-(big?12:5));s+=`<line x1=${x1} y1=${y1} x2=${x2} y2=${y2} stroke=#777 stroke-width=${big?2:1.4} />`}
[20,22,0,2,4,6,8].forEach(h=>{const [x,y]=pt(ang(h),R-62);s+=`<text x=${x} y=${y+7} text-anchor=middle fill=#bbb font-size=19>${String(h).padStart(2,"0")}</text>`});
const a1=ang(23),a2=ang(6.5),[sx,sy]=pt(a1,R),[ex,ey]=pt(a2,R);
const arc=`M${sx},${sy} A${R},${R} 0 0 1 ${ex},${ey}`;
s+=`<path d="${arc}" stroke=#22d035 stroke-width=58 fill=none stroke-linecap=round filter=url(#gl) opacity=.55 /><path d="${arc}" stroke=url(#ga) stroke-width=54 fill=none stroke-linecap=round /><path d="${arc}" stroke=url(#hatch) stroke-width=54 fill=none stroke-linecap=round />`;
const b1=ang(0.6),b2=ang(4.6),[px,py]=pt(b1,R),[qx,qy]=pt(b2,R);s+=`<path d="M${px},${py} A${R},${R} 0 0 1 ${qx},${qy}" stroke=#33c440 stroke-width=30 fill=none stroke-linecap=round /><path d="M${px},${py} A${R},${R} 0 0 1 ${qx},${qy}" stroke=rgba(0,40,0,.25) stroke-width=32 fill=none stroke-linecap=round /><path d="M${px},${py} A${R},${R} 0 0 1 ${qx},${qy}" stroke=#2fb83c stroke-width=28 fill=none stroke-linecap=round />`;
[[sx,sy,"☾"],[ex,ey,"☀"]].forEach(([x,y,t])=>{s+=`<circle cx=${x} cy=${y} r=26 fill=#1c8a2a stroke=#46e45a stroke-width=2 />`+(t=="☾"?`<path transform="translate(${x-12},${y-12})" d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" fill=#fff />`:`<g transform="translate(${x},${y})" stroke=#fff stroke-width=2.4 stroke-linecap=round><circle r=5 fill=#fff /><path d="M0 -12v3M0 9v3M-12 0h3M9 0h3M-8.5 -8.5l2 2M6.5 6.5l2 2M-8.5 8.5l2 -2M6.5 -6.5l2 -2"/></g>`)});
document.getElementById("dial").innerHTML=s;
</script>
