<script>
// stepped line
const ch=document.getElementById('ch'),L=40,R=670,T=10,B=230,yv=v=>T+(100-v)/60*(B-T);
let g='<defs><linearGradient id=fg x1=0 x2=0 y1=0 y2=1><stop offset=0 stop-color=#b9aca3 stop-opacity=.75 /><stop offset=1 stop-color=#fff stop-opacity=0 /></linearGradient></defs>';
for(let v=100;v>=40;v-=10){g+=`<text x=0 y=${yv(v)+4} font-size=12 fill=#8a7a70 font-family=Urbanist font-weight=600>${v}</text><path d="M${L-6} ${yv(v)}H${R}" stroke=#d8d3cf stroke-dasharray="5 5"/>`}
const lv=[[88,0,20],[66,30,56],[52,60,76],[80,82,104],[44,110,140],[58,148,166],[90,176,206],[62,214,232],[46,240,262],[56,268,284],[80,290,312],[60,320,338],[48,346,372],[94,380,402],[60,410,428],[50,434,456],[42,462,486],[64,494,518],[78,524,550]];
const sx=x=>L+x/550*(R-L-4);let pts=[];
lv.forEach(([v,a,b],i)=>{pts.push([sx(a),yv(v)],[sx(b),yv(v)])});
function rounded(p,r){let d=`M${p[0][0]} ${p[0][1]}`;for(let i=1;i<p.length-1;i++){const [x0,y0]=p[i-1],[x1,y1]=p[i],[x2,y2]=p[i+1];const l1=Math.hypot(x1-x0,y1-y0),l2=Math.hypot(x2-x1,y2-y1);const rr=Math.min(r,l1/2,l2/2);const ax=x1+(x0-x1)/l1*rr,ay=y1+(y0-y1)/l1*rr,bx=x1+(x2-x1)/l2*rr,by=y1+(y2-y1)/l2*rr;d+=`L${ax} ${ay}Q${x1} ${y1} ${bx} ${by}`}const q=p[p.length-1];return d+`L${q[0]} ${q[1]}`}
const d=rounded(pts,16);
g+=`<path d="${d}L${R-4} ${B}H${L}Z" fill=url(#fg) /><path d="${d}" fill=none stroke=#4f3422 stroke-width=3.2 stroke-linejoin=round />`;
[[3,'82%',-1],[8,'46%',1],[10,'80%',-1]].forEach(([i,t,dir])=>{const [v,a,b]=lv[i];const x=sx((a+b)/2),y=yv(v);g+=`<circle cx=${x} cy=${y} r=7 fill=#4f3422 stroke=#fff stroke-width=2.5 />`;const ty=dir<0?y-32:y+30;g+=`<rect x=${x-24} y=${ty-13} width=48 height=26 rx=13 fill=#4f3422 /><path d="M${x-5} ${dir<0?ty+12:ty-12}l5 ${dir<0?6:-6} 5 ${dir<0?-6:6}" fill=#4f3422 /><text x=${x} y=${ty+4.5} text-anchor=middle fill=#fff font-size=12 font-weight=700 font-family=Urbanist>${t}</text>`});
ch.innerHTML=g;
// sleep bars
const sl=document.getElementById('sl');[[34,.75],[70,.85],[122,.95],[90,.85],[56,.6],[78,.5],[18,.35]].forEach(([h,o])=>{sl.innerHTML+=`<i style="width:20px;height:${h}px;border-radius:10px;background:rgba(255,255,255,${o})"></i>`});
// dot grid
const dg=document.getElementById('dg');const on=[7,8,9,10,13,14,15,16,20,21];for(let i=0;i<24;i++){const c=on.includes(i)?'#fff3e6':(i%5==2?'#f6a35a':'#fbbb85');dg.innerHTML+=`<i style="aspect-ratio:1;border-radius:50%;background:${c}"></i>`}
</script>
