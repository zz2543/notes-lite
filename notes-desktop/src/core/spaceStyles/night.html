<!doctype html><meta charset=utf-8>
<style>
*{box-sizing:border-box}body{margin:0;width:1200px;height:860px;background:#c9c9c9;font-family:Inter,"Noto Sans SC",sans-serif;color:#fff;-webkit-font-smoothing:antialiased;display:grid;place-items:center}
.g{display:grid;grid-template-columns:repeat(3,320px);gap:24px}
.c{background:#1b1b1e;border-radius:26px;padding:28px 30px;display:flex;flex-direction:column}.c>*{flex-shrink:0}
.lab{display:flex;align-items:center;gap:14px;font-size:20px;letter-spacing:.12em;font-weight:500}
.lab svg{width:30px;height:30px}
.n{font-size:92px;font-weight:400;letter-spacing:-.04em;line-height:1;margin:26px 0 22px}.n small{font-size:38px;letter-spacing:0;margin-left:10px}
.bars{display:flex;gap:6px;height:98px;align-items:stretch}
.days{display:flex;justify-content:space-between;color:#8b8b92;font-size:19px;margin-top:16px;padding:0 2px}
.wide{grid-column:1/-1;height:360px;position:relative;overflow:hidden}
.btn{position:absolute;right:30px;bottom:30px;width:98px;height:98px;border-radius:50%;background:#fff;display:grid;place-items:center}
.meta{display:flex;gap:28px;font-size:28px;color:#e8e8ea;margin-top:auto;font-weight:300}.meta span{display:flex;align-items:center;gap:12px}
</style>
<div class=g>
 <div class=c><div class=lab><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" fill="#6c5cf6"/></svg>睡眠评分</div>
  <div class=n>82</div><div class=bars id=sl></div>
  <div class=days style="font-size:20px"><span style="color:#a99cff">深睡</span><span style="color:#5aa8ff">REM</span><span style="color:#8ce9f5">浅睡</span></div></div>
 <div class=c><div class=lab><svg viewBox="0 0 24 24"><path d="M12 21s-8-5.2-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.8-8 11-8 11z" fill="#f2364a"/></svg>心率变异</div>
  <div class=n>46<small>ms</small></div><svg id=hrv viewBox="0 0 260 98" width=260 height=98></svg>
  <div class=days><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div></div>
 <div class=c><div class=lab><svg viewBox="0 0 24 24"><path d="M12 21s-8-5.2-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.8-8 11-8 11z" fill="#f7861d"/><path d="M5 12h3.5l1.5-3 2.5 6 1.8-3.5H19" stroke="#1b1b1e" stroke-width="1.7" fill="none" stroke-linejoin="round"/></svg>静息心率</div>
  <div class=n>52<small>bpm</small></div><div class=bars id=st style="gap:14px"></div>
  <div class=days><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div></div>
 <div class="c wide"><div class=lab style="font-size:24px;letter-spacing:.22em;font-weight:400;color:#cfcfd3">今日建议训练</div>
  <div style="font-size:104px;font-weight:300;letter-spacing:-.03em;margin-top:34px;line-height:1">推日 · 胸肩</div>
  <div class=meta><span><svg width=34 height=34 viewBox="0 0 24 24" fill=none stroke=#e8e8ea stroke-width=1.4><circle cx=12 cy=12 r=9 /><path d="M12 7v5l3 2"/></svg>50 分钟</span><span><svg width=34 height=34 viewBox="0 0 24 24" fill=none stroke=#e8e8ea stroke-width=1.4><path d="M12 3c3 4 6 7 6 11a6 6 0 0 1-12 0c0-2.5 1.2-4.6 3-6.5.2 2 1 3.2 2.3 3.8C11 8.6 11.3 5.6 12 3z"/></svg>420 千卡</span><span><svg width=34 height=34 viewBox="0 0 24 24" fill=none stroke=#e8e8ea stroke-width=1.4><path d="M6 8v8M18 8v8M3 10v4M21 10v4M6 12h12"/></svg>卧推 5×5 · 65 kg</span></div>
  <svg viewBox="0 0 400 360" style="position:absolute;right:-70px;top:10px;height:400px">
   <defs><radialGradient id=pl cx=.4 cy=.35><stop offset=0 stop-color=#3a3a40 /><stop offset=1 stop-color=#141416 /></radialGradient><linearGradient id=rim x1=0 x2=1 y1=0 y2=1><stop offset=0 stop-color=#6a6a72 /><stop offset=.5 stop-color=#202024 /><stop offset=1 stop-color=#4a4a50 /></linearGradient></defs>
   <circle cx=230 cy=200 r=170 fill=url(#pl) stroke=url(#rim) stroke-width=3 />
   <circle cx=230 cy=200 r=128 fill=none stroke=#2c2c31 stroke-width=2 /><circle cx=230 cy=200 r=118 fill=none stroke=#0f0f11 stroke-width=6 />
   <circle cx=230 cy=200 r=40 fill=#0d0d0f stroke=url(#rim) stroke-width=3 /><circle cx=230 cy=200 r=22 fill=#000 />
   <text x=230 y=104 text-anchor=middle fill=#55555c font-size=22 font-family=Inter letter-spacing=6>20 KG</text>
  </svg>
  <div class=btn><svg width=40 height=40 viewBox="0 0 24 24" fill=none stroke=#111 stroke-width=1.6 stroke-linecap=round><path d="M4 12h15M13 6l6 6-6 6"/></svg></div></div>
</div>
<script>
const mix=(a,b,t)=>a.map((x,i)=>Math.round(x+(b[i]-x)*t));
const A=[150,128,246],B=[82,152,255],C=[128,236,246];
document.getElementById("sl").innerHTML=Array.from({length:14},(_,i)=>{const t=i/13,c=t<.5?mix(A,B,t*2):mix(B,C,(t-.5)*2);return `<i style="flex:1;border-radius:3px;background:rgb(${c})"></i>`}).join("");
let h="";const lo=[30,34,48,38,26,22,30],hi=[60,62,86,66,52,44,64],w=260/7;
for(let i=0;i<7;i++){const x=i*w+w/2;h+=`<rect x=${x-11} y=0 width=22 height=98 rx=6 fill=#3a2a2e />`;h+=`<rect x=${x-11} y=${lo[i]} width=22 height=${hi[i]-lo[i]} rx=6 fill=#f49aa4 />`}
const mid=lo.map((l,i)=>[i*w+w/2,(l+hi[i])/2]);let d=`M${mid[0][0]-14},${mid[0][1]-2}`;for(let i=0;i<7;i++){const[x,y]=mid[i];d+=` S${x-10},${y} ${x},${y}`}d+=` S${mid[6][0]+10},${mid[6][1]+4} ${mid[6][0]+14},${mid[6][1]+6}`;
h+=`<path d="${d}" fill=none stroke=#f2364a stroke-width=2.2 />`;document.getElementById("hrv").innerHTML=h;
const lv=[3,5,4,5,6,5,3];document.getElementById("st").innerHTML=lv.map(n=>`<div style="flex:1;display:flex;flex-direction:column-reverse;gap:4px">${Array.from({length:8},(_,k)=>`<i style="flex:1;border-radius:2px;background:${k<n?'#f6a14a':'#3b3128'}"></i>`).join("")}</div>`).join("");
</script>
