# First releases are unsigned: no certificate, notarization or auto-update. The product name comes
# from package.json.
appId: dev.notes-desktop.app
directories:
  output: dist
files:
  - out/**
  - package.json
# Licences of what ships inside the app, such as the bundled fonts (OFL), beside it in its resources.
extraResources:
  - from: resources/licenses
    to: licenses
mac:
  target: dmg
  category: public.app-category.productivity
  # Ad-hoc signature: needs no certificate, but keeps the bundle's seal intact so a downloaded copy
  # opens as an unidentified developer's app instead of a "damaged" one on Apple Silicon.
  identity: "-"
  hardenedRuntime: false
win:
  target: nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
publish: null
