<style>

:thin}.sheet{max-width:750px;padding:52px 64px 80px;margin:auto}.eyebrow{font-size:10px;letter-spacing:.16em;color:#879381;margin-bottom:23px;display:flex;align-items:center;gap:9px}.eyebrow:before{content:"";width:18px;height:1px;background:#96a38b}.note-title{border:0;outline:none;background:none;width:100%;font-family:Georgia,"Songti SC",serif;font-size:36px;letter-spacing:-.04em;color:#354637;font-weight:500;padding:0;margin:0 0 15px}.meta{display:flex;gap:16px;font-size:10px;color:#9b9e92;margin-bottom:34px}.divider{height:1px;background:var(--line);margin-bottom:26px}.body{display:block;width:100%;height:330px;resize:none;border:0;outline:0;background:transparent;line-height:2.05;font-size:14px;color:#5c6559;overflow:hidden}.foot{display:flex;justify-content:space-between;font-size:10px;color:#a1a69b;padding:0 25px 17px}.sidebar{flex:0 0 205px;background:#f0f2eb;padding:21px 14px;display:flex;flex-direction:column;border-right:1px solid var(--line);overflow:auto}.brand{font-family:Georgia,"Songti SC",serif;font-size:19px;margin:0 12px 27px;display:flex;gap:10px;align-items:center}.brand small{font:9px -apple-system,sans-serif;color:#94a08e;letter-spacing:.13em}.section-title{font-size:9px;letter-spacing:.09em;color:#969e8e;padding:23px 12px 10px}.navrow{display:flex;width:100%;align-items:center;gap:10px;text-align:left;padding:10px 12px;border-radius:8px;font-size:12px;margin-bottom:3px}.navrow svg{width:15px;height:15px}.navrow.active{background:#dfe7d9;color:#3d5c3b}.navrow small{margin-left:auto;color:#919e89;font-size:10px}.sidebar .bottom{margin-top:auto;padding-top:20px;font-size:10px;color:#9aa28f}.note-list{flex:0 0 245px;padding:24px 14px;background:#f8f9f4;border-right:1px solid var(--line);overflow:auto}.list-heading{display:flex;justify-content:space-between;align-items:center;margin:0 6px 17px;font-size:15px}.list-heading small{color:#9da492;font-size:10px}.list-card{padding:16px 13px;display:block;text-align:left;width:100%;border-radius:10px;margin-bottom:6px}.list-card.active{background:#e7eddf}.list-card strong{display:block;font-size:12px;font-weight:500;margin-bottom:9px}.list-card p{font-size:10px;line-height:1.8;color:#969e8e;margin:0 0 9px}.list-card small{font-size:9px;color:#a4aa9b}.bottom-info{position:absolute;left:23px;bottom:18px;font-size:10px;color:#9ba18f}.variant-A .titlebar{background:#faf9f4;border-color:#ecebe3}.variant-A{--paper:#faf9f4;--line:#e8e7de}.variant-A .sheet{max-width:760px;padding-top:60px}.variant-A .note-title{font-size:40px}.variant-A .workspace{display:block}.variant-A .editor{height:100%}.variant-A .body{font-family:Georgia,"Songti SC",serif;font-size:15px}.variant-C{--paper:#f7f8f2;background:#e5eadd}.variant-C .titlebar{color:#61715a;background:#e5eadd}.variant-C .workspace{padding:10px 45px 28px}.variant-C .editor{background:#fbfcf8;border:1px solid #fff;border-radius:13px;box-shadow:0 9px 26px #3b4f3010}.variant-C .sheet{padding-top:40px}.variant-C .foot{background:#e5eadd}.dock{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;padding:6px;gap:5px;border:1px solid #fff9;border-radius:15px;background:#ffffffca;backdrop-filter:blur(18px);box-shadow:0 8px 25px #3d513025;z-index:5}.dock button{display:flex;align-items:center;gap:7px;padding:9px 12px;font-size:11px;border-radius:10px}.dock button:first-child{background:#e3eadb}.dock svg{width:15px;height:15px}.mask{position:absolute;inset:0;background:#263d2426;backdrop-filter:blur(3px);z-index:9;display:none}.panel{position:absolute;z-index:10;background:#f8faf3f5;backdrop-filter:blur(22px);box-shadow:0 24px 80px #1f3b2738;display:none;overflow:hidden;will-change:transform,opacity}.panel.side{left:0;top:0;bottom:0;width:300px;border-radius:0 15px 15px 0}.panel.float{left:50%;top:13%;width:min(540px,90%);border:1px solid #ffffff;border-radius:19px}.panel-header{display:flex;align-items:center;padding:18px 20px;gap:10px;border-bottom:1px solid var(--line)}.panel-header input{flex:1;min-width:0;background:none;border:0;color:var(--ink);font-size:14px}.panel-header kbd{font-size:9px;color:#99a48f}.results{padding:12px;max-height:340px;overflow:auto}.result{display:flex;align-items:center;gap:13px;width:100%;padding:14px;border-radius:10px;text-align:left}.result svg{color:#8a9d7d}.result strong{font-size:12px;font-weight:500;display:block}.result small{display:block;font-size:10px;color:#929f89;margin-top:5px}.result:hover{background:#e3ebda}.panel-hint{padding:12px 23px;color:#9ca590;font-size:10px;border-top:1px solid var(--line)}.switcher{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#263c31;color:#f1f5ea;box-shadow:0 12px 25px #263c312a;border:1px solid #ffffff30;display:flex;align-items:center;padding:6px;border-radius:16px;gap:4px;z-index:99}.switcher button{color:#bbc8b8;border-radius:10px;padding:11px 15px;font-size:11px;white-space:nowrap}.switcher button.on{background:#f1f5e8;color:#344b39;box-shadow:0 3px 8px #0002}.switcher .arrow{padding:9px;width:34px;font-size:17px}.switcher button:hover{background:#ffffff18;color:white}.switcher button.on:hover{background:#fff;color:#344b39}.state{position:fixed;bottom:4px;left:0;right:0;text-align:center;font-size:9px;color:#8b9585}.tag{border:1px solid #a3b49655;border-radius:5px;padding:3px 7px;font-size:9px;color:#8a9c7c}.empty{padding:30px;color:#85917e;font-size:12px;text-align:center}.zen .sidebar,.zen .note-list{display:none}.zen .dock{opacity:0;pointer-events:none}@media(max-width:950px){.preview{padding:15px 14px 100px}.sidebar{flex-basis:160px}.note-list{flex-basis:195px}.sheet{padding:35px}.note-title{font-size:29px}.variant-C .workspace{padding:8px 22px 26px}.breadcrumb{display:none}}@media(max-width:700px){.sidebar{flex-basis:125px;padding:15px 5px}.note-list{flex-basis:150px;padding:18px 7px}.sheet{padding:30px 23px}.body{font-size:12px}.note-title,.variant-A .note-title{font-size:26px}.switcher button{padding:10px}.context span{display:none}.brand{font-size:15px;margin-left:8px}.navrow{font-size:10px;padding:9px 7px}.preview{min-height:600px}}@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
.sidebar,.note-list{flex-shrink:0}.brand{white-space:nowrap}.saved{white-space:nowrap}@media(max-width:950px){.brand small{display:none}}@media(max-width:560px){.saved,.traffic{display:none}.titlebar{gap:8px;padding:0 12px}.variant-B .sidebar{flex-basis:48px;padding:15px 4px}.variant-B .sidebar .brand,.variant-B .sidebar .section-title,.variant-B .sidebar .bottom{display:none}.variant-B .navrow{font-size:0;justify-content:center;padding:10px 0;gap:0}.variant-B .navrow small{display:none}.variant-B .note-list{flex-basis:110px;padding:16px 5px}.variant-B .list-card{padding:12px 7px}.variant-B .sheet{padding:25px 15px}.variant-B .note-title{font-size:20px}.variant-B .eyebrow{font-size:7px;letter-spacing:0}.variant-B .meta{flex-wrap:wrap;gap:7px}.context{font-size:10px}.switcher button{padding:10px 7px}.switcher .arrow{width:23px}.variant-C .workspace{padding:8px 10px 26px}.dock button{padding:8px}.tag{display:none}}.focus-exit{display:none;position:absolute;top:14px;right:18px;z-index:8;font-size:10px;border-radius:9px;padding:8px 11px;color:#7b8975;background:#eff3e7d9;opacity:.18}.focus-exit:hover,.focus-exit:focus-visible{opacity:1}.zen .focus-exit{display:block}.zen .titlebar,.zen .foot,.zen .eyebrow,.zen .meta,.zen .divider{display:none}.zen .sheet{max-width:820px;padding:65px 65px 90px}.zen .note-title{margin-bottom:35px}.zen .workspace{padding:0}.zen .editor{border:0;border-radius:0;box-shadow:none}@media(max-width:560px){.zen .sheet{padding:65px 26px}}
</style></head><body>
<div class="preview"><header class="context"><strong>布局实验 / 独立笔记软件</strong><span id="explain"></span><span>临时原型 · 示例资料 · 不写入文件</span></header><main class="frame" id="app"></main></div>
<nav class="switcher" aria-label="切换设计方案"><button class="arrow" onclick="cycle(-1)" aria-label="上一个方案">‹</button><button data-v="A" onclick="setVariant('A')">A 纸页写作</button><button data-v="B" onclick="setVariant('B')">B 清晰资料库</button><button data-v="C" onclick="setVariant('C')">C 按需导航</button><button class="arrow" onclick="cycle(1)" aria-label="下一个方案">›</button></nav><div class="state" id="state"></div>
<script>
const paths={menu:'M4 5h16M4 12h16M4 19h16',search:'M21 21l-5-5M18 10a8 8 0 1 1-16 0 8 8 0 0 1 16 0',plus:'M12 5v14M5 12h14',file:'M14 2H5v20h14V7zM14 2v6h5M8 13h8M8 17h6',folder:'M3 6h7l2 2h9v12H3z',clock:'M12 8v5l3 2M22 12a10 10 0 1 1-20 0 10 10 0 0 1 20 0',expand:'M8 3H3v5M16 3h5v5M3 16v5h5M21 16v5h-5',back:'M15 5l-7 7 7 7',leaf:'M20 3C7 2 2 7 5 15c8 5 15-1 15-12ZM5 20L16 8',link:'M10 13a5 5 0 0 0 7 0l4-4a5 5 0 0 0-7-7l-3 3M14 11a5 5 0 0 0-7 0l-4 4a5 5 0 0 0 7 7l3-3'};
const icon=n=>`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${paths[n]||paths.file}"/></svg>`;
const notes=[{id:1,title:'给思考留一点空白',folder:'随手记',text:'我们不必把每一分钟都填满。\n\n散步的时候，把手机留在口袋里。让注意力沿着树影、风声和街角的气味，慢慢回到眼前。\n\n留白不是等待被填补的空间，而是让新的想法有机会发生。\n\n## 可以从这些小事开始\n\n- 清晨，先写下一个想法，再打开消息\n- 每天留出一段没有安排的时间\n- 读到喜欢的句子，记进 [[阅读摘记]]\n\n“慢下来，才能看见事物本来的样子。”'},{id:2,title:'阅读摘记',folder:'阅读',text:'## 关于注意力\n\n一本书不必读得很快。遇到值得停留的句子，可以合上书，让它在脑海里多待一会儿。\n\n## 留给自己的问题\n\n今天读到的内容，和自己的生活有什么联系？\n\n相关笔记：[[给思考留一点空白]]'},{id:3,title:'周末去看一片森林',folder:'生活',text:'## 带上什么\n\n- 水、相机、一本薄薄的书\n- 一段不急着结束的时间\n\n沿着小路走到尽头，坐下来听一会儿风。'},{id:4,title:'一个小小的产品想法',folder:'随手记',text:'## 让写作回到写作\n\n只留下一张安静的纸，和随时可以找到的笔记。\n\n界面可以轻盈，内容应该扎实。\n\n先记下来，以后再慢慢想。'}];
let variant=['A','B','C'].includes(new URLSearchParams(location.search).get('variant'))?new URLSearchParams(location.search).get('variant'):'A',current=1,filter='全部笔记',zen=false,panelOpen=false,springFrame=0,springX=0,springV=0;
const app=document.getElementById('app'),reduced=matchMedia('(prefers-reduced-motion: reduce)');
const escape=s=>s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('"','&quot;');
function note(){return notes.find(n=>n.id===current)}
function tool(n,label,action){return `<button class="icon" title="${label}" aria-label="${label}" onclick="${action}">${icon(n)}</button>`}
function editor(){return `<section class="editor"><article class="sheet"><div class="eyebrow">A LITTLE ROOM FOR THOUGHT</div><input class="note-title" aria-label="笔记标题" value="${escape(note().title)}" oninput="editTitle(this.value)"><div class="meta"><span>10 月 16 日，星期五</span><span>${note().folder}</span><span>本地 Markdown</span></div><div class="divider"></div><textarea class="body" aria-label="笔记正文" oninput="editBody(this)">${escape(note().text)}</textarea></article></section>`}
function sidebar(){return `<aside class="sidebar"><div class="brand">${icon('leaf')} 未命名 <small>NOTES</small></div><button class="navrow" onclick="openPanel('search')">${icon('search')}搜索笔记 <small>⌘ K</small></button><button class="navrow ${filter==='全部笔记'?'active':''}" onclick="setFilter('全部笔记')">${icon('file')}全部笔记 <small>${notes.length}</small></button><button class="navrow ${filter==='最近打开'?'active':''}" onclick="setFilter('最近打开')">${icon('clock')}最近打开</button><div class="section-title">我的文件夹</div>${['随手记','阅读','生活'].map(f=>`<button class="navrow ${filter===f?'active':''}" onclick="setFilter('${f}')">${icon('folder')}${f}<small>${notes.filter(n=>n.folder===f).length}</small></button>`).join('')}<div class="bottom">本地笔记库 · 示例内容</div></aside>`}
function list(){const selected=notes.filter(n=>['全部笔记','最近打开'].includes(filter)||n.folder===filter);return `<section class="note-list"><div class="list-heading">${filter}<small>${selected.length} 篇</small></div>${selected.map(n=>`<button class="list-card ${current===n.id?'active':''}" onclick="selectNote(${n.id})"><strong>${escape(n.title)}</strong><p>${escape(n.text.replaceAll('#','').replaceAll('\n',' ').slice(0,42))}…</p><small>今天 · ${n.folder}</small></button>`).join('')}</section>`}
function render(){cancelAnimationFrame(springFrame);panelOpen=false;springX=0;springV=0;app.className=`frame variant-${variant} ${zen?'zen':''}`;
app.innerHTML=`<button class="focus-exit" onclick="toggleZen()" aria-label="退出专注模式">退出专注 · Esc</button><header class="titlebar"><div class="traffic"><i></i><i></i><i></i></div>${tool(variant==='B'?'expand':'menu',variant==='B'?'收起或展开导航':'打开笔记导航',variant==='B'?'toggleZen()':"openPanel('browse')")}<span class="breadcrumb">${variant==='A'?'我的笔记 / ':variant==='B'?'本地笔记库 / ':'工作空间 / '}${note().folder}</span><div class="spacer"></div><div class="top-actions"><span class="saved" id="saved">示例内容</span>${tool('search','搜索笔记',"openPanel('search')")}${tool('plus','新建示例笔记','newNote()')}${tool('expand','切换专注模式','toggleZen()')}</div></header><div class="workspace">${variant==='B'?sidebar()+list():''}${editor()}${variant==='C'?`<div class="dock"><button onclick="openPanel('browse')">${icon('menu')}笔记</button><button onclick="openPanel('search')">${icon('search')}搜索 <span style="opacity:.5">⌘ K</span></button><button onclick="newNote()">${icon('plus')}新建</button></div>`:''}</div><footer class="foot"><span>Markdown · 演示编辑区</span><span id="wordcount"></span></footer><div class="mask" id="mask" onclick="closePanel()"></div><section class="panel ${variant==='A'?'side':'float'}" id="panel" role="dialog" aria-modal="true" aria-label="笔记导航"><div class="panel-header">${icon('search')}<input id="query" placeholder="搜索标题或正文…" aria-label="搜索示例笔记" oninput="renderResults(this.value)"><button class="icon" onclick="closePanel()" aria-label="关闭导航">×</button></div><div class="results" id="results"></div><div class="panel-hint">${variant==='A'?'侧边导航 · 选择后回到纸页':'浮动导航 · 选择后收起'} · Esc 关闭</div></section>`;
document.getElementById('explain').textContent={A:'正文优先 / 侧栏按需展开',B:'文件夹 → 笔记列表 → 正文',C:'正文工作台 / 导航浮层随用随收'}[variant];document.querySelectorAll('[data-v]').forEach(b=>{b.classList.toggle('on',b.dataset.v===variant);b.setAttribute('aria-pressed',b.dataset.v===variant)});resizeBody();updateState();}
function resizeBody(){const t=document.querySelector('.body');t.style.height='auto';t.style.height=t.scrollHeight+10+'px';document.getElementById('wordcount').textContent=note().text.replace(/\s/g,'').length+' 字'}
function updateState(){document.getElementById('state').textContent=`原型状态：方案 ${variant} · ${notes.length} 篇示例 · ${panelOpen?'导航已打开':'导航已收起'} · ${zen?'专注模式':'普通模式'} · 仅内存保存，刷新重置`}
function setVariant(v){variant=v;zen=false;filter='全部笔记';const url=new URL(location);url.searchParams.set('variant',v);history.replaceState({},'',url);render();console.info('Prototype state',{variant,current,filter,zen,panelOpen,notes:notes.length})}
function cycle(d){setVariant(['A','B','C'][(['A','B','C'].indexOf(variant)+d+3)%3])}
function setFilter(f){filter=f;render()}
function toggleZen(){zen=!zen;app.classList.toggle('zen',zen);resizeBody();updateState();if(zen)document.querySelector('.body').focus()}
function selectNote(id){current=id;render()}
function newNote(){const id=Date.now();notes.unshift({id,title:'未命名笔记',folder:'随手记',text:''});current=id;filter='全部笔记';render();document.querySelector('.note-title').focus();document.querySelector('.note-title').select()}
function editTitle(v){note().title=v;document.getElementById('saved').textContent='已暂存 · 内存'}
function editBody(el){note().text=el.value;resizeBody();document.getElementById('saved').textContent='已暂存 · 内存'}
function renderResults(q=''){const matches=notes.filter(n=>(n.title+n.text).toLowerCase().includes(q.toLowerCase()));document.getElementById('results').innerHTML=matches.length?matches.map(n=>`<button class="result" onclick="selectNote(${n.id})">${icon('file')}<span><strong>${escape(n.title||'未命名笔记')}</strong><small>${n.folder} · ${n.id===current?'正在编辑':'今天更新'}</small></span></button>`).join(''):'<div class="empty">没有找到笔记，换个词试试。</div>'}
function animatePanel(target){cancelAnimationFrame(springFrame);const panel=document.getElementById('panel'),mask=document.getElementById('mask');let last=performance.now();function draw(){const value=springX;panel.style.opacity=Math.max(0,Math.min(1,value));mask.style.opacity=Math.max(0,Math.min(1,value));panel.style.transform=variant==='A'?`translateX(${(value-1)*300}px)`:`translateX(-50%) translateY(${(1-value)*-28}px) scale(${.9+.1*value})`}
function tick(now){const dt=Math.min((now-last)/1000,.025);last=now;springV+=(370*(target-springX)-27*springV)*dt;springX+=springV*dt;draw();if(Math.abs(springX-target)>.001||Math.abs(springV)>.008)springFrame=requestAnimationFrame(tick);else{springX=target;springV=0;draw();if(!target){panel.style.display='none';mask.style.display='none'}}}if(reduced.matches){springX=target;springV=0;draw();if(!target){panel.style.display='none';mask.style.display='none'}return}springFrame=requestAnimationFrame(tick)}
function openPanel(mode){panelOpen=true;const p=document.getElementById('panel');p.style.display='block';document.getElementById('mask').style.display='block';const q=document.getElementById('query');q.value='';renderResults();animatePanel(1);q.focus();updateState()}
function closePanel(){panelOpen=false;animatePanel(0);document.querySelector('.top-actions .icon').focus();updateState()}
addEventListener('popstate',()=>{const v=new URLSearchParams(location.search).get('variant');variant=['A','B','C'].includes(v)?v:'A';render()});
addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();panelOpen?closePanel():openPanel('search');return}if(e.key==='Escape'&&panelOpen){closePanel();return}if(e.key==='Escape'&&zen){toggleZen();return}if(e.target.matches('input,textarea,[contenteditable]'))return;if(e.key==='ArrowRight')cycle(1);if(e.key==='ArrowLeft')cycle(-1)});render();
</script></body></html>
