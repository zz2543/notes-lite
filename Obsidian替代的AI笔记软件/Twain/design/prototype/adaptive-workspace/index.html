:root{--ease-out:cubic-bezier(0.23,1,0.32,1);--ease-in-out:cubic-bezier(0.77,0,0.175,1);--press-time:120ms;--surface-time:220ms}
.btn,.send,.option{transition:transform var(--press-time) var(--ease-out),background 150ms ease}.btn:active,.send:active,.option:active{transform:scale(.97)}
.prototype-switcher{background:#23372de8;backdrop-filter:blur(16px)}
.toast{opacity:1;transform:translate(-50%,0);transition:opacity 180ms var(--ease-out),transform 200ms var(--ease-out);pointer-events:none}.toast.hidden{display:block;opacity:0;transform:translate(-50%,50%)}
.dialog{border:1px solid #cbd2c5;padding:0;color:var(--ink);margin:auto;max-height:calc(100dvh - 40px);opacity:1;transform:scale(1);transition:opacity var(--surface-time) var(--ease-out),transform var(--surface-time) var(--ease-out)}
.dialog::backdrop{background:#20352b55;backdrop-filter:blur(4px);opacity:1;transition:opacity var(--surface-time) var(--ease-out)}
.dialog.closing{opacity:0;transform:scale(.96);transition-duration:160ms}.dialog.closing::backdrop{opacity:0;transition-duration:160ms}
@starting-style{.dialog[open]{opacity:0;transform:scale(.96)}.dialog[open]::backdrop{opacity:0}}
body[data-keyboard] .btn,body[data-keyboard] .send,body[data-keyboard] .option,body[data-keyboard] .toast,body[data-keyboard] .dialog,body[data-keyboard] .dialog::backdrop{transition:none}
body[data-keyboard] .btn:active,body[data-keyboard] .option:active{transform:none}
@media(hover:hover) and (pointer:fine){.btn:hover{background:var(--mint)}.btn.primary:hover{background:#34583e}.option:hover{background:var(--mint)}}
@media(hover:none){.btn:hover,.option:hover{background:var(--paper)}.btn.primary:hover{background:var(--green)}}
@media(prefers-reduced-motion:reduce){.btn,.send,.option{transition:background 150ms ease}.btn:active,.send:active,.option:active{transform:none}.toast,.toast.hidden{transform:translate(-50%,0);transition:opacity 160ms var(--ease-out)}.dialog,.dialog.closing{transform:none;transition:opacity 160ms var(--ease-out)}@starting-style{.dialog[open]{transform:none}}}
@media(prefers-reduced-transparency:reduce){.dialog::backdrop{backdrop-filter:none;background:#20352b88}.prototype-switcher{backdrop-filter:none;background:#23372d}}
@media(prefers-contrast:more){:root{--muted:#526151;--line:#9faa99}.btn,.option{border-color:#74836f}.prototype-switcher{background:#173121}}
</style>

<body>
<div class="prototype-head"><div><strong>界面原型 · 共笔</strong><span class="sub">　探索：模式与阶段怎样改变整个工作区？</span></div><div class="top-tools"><button data-action="guide">体验引导</button><button data-action="state">观察状态</button><button data-action="reset">重置</button></div></div>
<div id="app"></div>
<div class="prototype-switcher" id="switcher" aria-label="原型方向切换"></div>
<div id="modal"></div><div id="toast" class="toast hidden" role="status"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon=(name)=>({write:'↗',learn:'◌',organize:'▤',custom:'◇'}[name]||'◇');
const variants={A:'稿纸与页边协作',B:'按阶段展开的舞台',C:'可组合的自由工作台'};
const builtin=[{id:'write',name:'自由共写',summary:'资料与想法，落在同一页上。'},{id:'learn',name:'自适应学习',summary:'从你已经理解的地方，开始下一步。'},{id:'organize',name:'资料整理',summary:'看清材料，选好方案，再开始整理。'}];
const initialMarkdown='# 理解函数的变化\n\n一个函数描述的是：输入变化时，输出如何变化。\n\n以 f(x) = x² 为例，x 从 2 变成 3，输出从 4 变成 9。这段区间的平均变化率是 5。\n\n如果只看 x = 2 附近，我们关心的是瞬时变化率，而不是整段区间的平均值。\n\n## 还想弄清楚\n\n- [ ] 平均变化率与瞬时变化率有什么区别？\n- [ ] 曲线的切线为什么能描述瞬时变化？';
function newRecord(id,mode='write'){return{id,title:'理解函数的变化',mode,messages:[],promptDraft:'',learning:{phase:'intro',topic:'函数与变化',answers:[],choice:null,feedback:null,demo:false,coefficient:1,quizChoice:null,quizFeedback:null},organizing:{phase:'sources',selected:[0,1,2],approved:[0,1,2],result:[]},customAnswer:''}}
function makeState(){const v=new URLSearchParams(location.search).get('variant');return{variant:variants[v]?v:'A',mode:'write',recordId:1,nextRecord:2,records:[newRecord(1)],modes:[...builtin],markdown:initialMarkdown,mdVersion:1,html:null,htmlSourceVersion:null,format:'md',showFormat:true,htmlStyle:'纸与墨',files:[{title:'函数与变化.md',after:'概念/函数与变化.md',summary:'平均变化率、瞬时变化率，以及一个仍未解释的例子。'},{title:'课堂随手记.md',after:'课堂/变化率.md',summary:'三个关于函数变化的课堂片段。'},{title:'切线与导数.md',after:'概念/切线与导数.md',summary:'切线的几何直觉，与导数的联系。'}],run:null,profile:{attempts:0,correct:0,weakness:'',topic:'函数与变化'},modal:null,draft:null,draftRequest:'做一个「对照辩论」模式：左边给出支持观点，右边给出反方质疑。一次只问我一个问题，等我回答后再继续。',lastAction:'打开示例笔记。全部 Agent 行为为本地模拟，刷新后重置。',board:[['main'],['sources','context'],['history']],historyOpen:false,nextRun:1}}
let state=makeState(),runTimer=null,toastTimer=null,modalExitTimer=null,renderKey='',lastInput='pointer';
const reduced=()=>window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function surfaceMotion(el,duration=180){if(!el||lastInput==='keyboard')return;el.getAnimations().forEach(a=>a.cancel());el.animate(reduced()?[{opacity:.65},{opacity:1}]:[{opacity:.5,transform:'translateY(6px)'},{opacity:1,transform:'translateY(0)'}],{duration,easing:'cubic-bezier(0.23,1,0.32,1)'})}
function focusedSnapshot(){const el=document.activeElement;if(!el?.dataset.field)return null;return{field:el.dataset.field,value:el.value,start:el.selectionStart,end:el.selectionEnd,modal:!!el.closest('dialog')}}
function restoreFocus(s){if(!s)return;const root=s.modal?$('#modal'):$('#app');const el=root.querySelector(`[data-field="${s.field}"]`);if(!el)return;if(s.field==='prompt')el.value=s.value;el.focus({preventScroll:true});if(typeof s.start==='number'&&['text','search','textarea'].includes(el.type))el.setSelectionRange(s.start,s.end)}
const record=()=>state.records.find(r=>r.id===state.recordId);
const mode=()=>state.modes.find(m=>m.id===state.mode)||builtin[0];
function addMessage(kind,text,owner=record(),originMode=owner.mode){owner.messages.push({kind,text,mode:originMode,time:new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})});}
function toast(text){$('#toast').textContent=text;$('#toast').classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').classList.add('hidden'),3300)}
function changed(text,notify=false){state.lastAction=text;render();if(notify)toast(text)}
function phaseName(r=record()){return{intro:'选择主题',diagnose:'判断理解',scope:'确定范围',lesson:'讲解知识',quiz:'小测',review:'调整与回顾'}[r.learning.phase]||'进行中'}
function modeButtons(){return `<nav class="mode-nav" aria-label="交互模式">${state.modes.map(m=>`<button class="${state.mode===m.id?'active':''}" data-action="mode" data-id="${esc(m.id)}" aria-pressed="${state.mode===m.id}">${icon(m.id)}　${esc(m.name)}</button>`).join('')}</nav>`}
function runStrip(){if(!state.run||state.run.status!=='running')return'';const r=state.run;return `<div class="run-strip"><span class="dot"></span><span>${esc(r.label)} ${r.progress}%${r.mode!==state.mode?' · 原模式继续运行':''}</span><progress max="100" value="${r.progress}"></progress><button data-action="owner">回到记录</button><button data-action="stop">停止</button></div>`}
function appbar(hasModes=true){return `<header class="appbar"><div class="row"><div class="traffic"><i></i><i></i><i></i></div><span class="logo">tw</span><span class="brand">共笔</span></div><span class="current-title">个人笔记库 / ${esc(record().title)}</span><div class="grow"></div>${hasModes?modeButtons():''}<button class="btn ghost" data-action="new-record">＋ 新交流</button><button class="btn" data-action="creator">◇ ${mode().blocks?'修改模式':'创建模式'}</button>${!hasModes?`<div class="mobile-mode-nav">${modeButtons()}</div>`:''}</header>`}
function ribbon(){const r=record();return `<div class="state-ribbon"><span>方向 <b>${state.variant}</b></span><span>当前模式 <b>${esc(mode().name)}</b></span><span>记录 <b>#${r.id} · ${r.messages.length} 条</b></span><span>文件 <b>MD v${state.mdVersion}${state.html?` / HTML ← v${state.htmlSourceVersion}`:''}</b></span><span>${state.mode==='learn'?`学习阶段 <b>${phaseName()}</b>`:'资料与模式独立'}</span><span>模拟 Agent · 仅内存 · 刷新重置</span></div>`}
function library(){return `<div class="library-list">${state.files.map((f,i)=>`<div class="file ${i===0?'active':''}"><span>▯</span><span>${esc(f.title)}</span></div>`).join('')}</div>`}
function recordLinks(){return state.records.map(r=>`<button class="side-record ${r.id===state.recordId?'active':''}" data-action="record" data-id="${r.id}"><span>${esc(r.title)} ${r.id>1?`· ${r.id}`:''}</span><span class="muted tiny">${r.messages.length}</span></button>`).join('')}
function heading(){return `<div class="mode-title"><div class="kicker">${state.mode==='learn'?'LEARN / ADAPT':state.mode==='organize'?'COLLECT / CLARIFY':'THINK / MAKE'}</div><h1 style="margin-top:9px">${esc(state.mode==='write'?'让想法在这一页生长':state.mode==='learn'?record().learning.topic:state.mode==='organize'?'给这些材料一个位置':mode().name)}</h1><p>${esc(mode().summary)}</p></div>`}
function historyView(limit=20){const messages=record().messages.slice(-limit);if(!messages.length)return `<div class="context-card"><div class="kicker">这一段交流的起点</div><p>一篇笔记，三个还没想清楚的问题。你可以开始讨论，也可以换一种方式处理它。</p><p class="tiny muted">示例内容 · 回复为模拟</p></div>`;return `<div class="history-list">${messages.map(m=>`<div class="message ${m.kind}"><div class="who"><span>${m.kind==='user'?'你':m.kind==='system'?'过程记录':'模拟 Agent'} · ${esc(state.modes.find(x=>x.id===m.mode)?.name||m.mode)}</span><span>${m.time}</span></div><p>${esc(m.text)}</p></div>`).join('')}</div>`}
function prompt(){return `<div class="prompt-box"><textarea aria-label="与 Agent 交流" placeholder="${state.mode==='learn'?'这里不明白？说说你卡在哪一步…':'描述你想做什么，或接着刚才讨论…'}" data-field="prompt">${esc(record().promptDraft)}</textarea><button class="send" data-action="send" aria-label="发送">↑</button></div>`}
function support(){const r=record();if(state.mode==='learn')return `<div class="support-label">这次学习的路径</div><div class="adaptive-map">${['判断理解','确定范围','讲解知识','小测检验'].map((s,i)=>`<div class="timeline-item"><strong>${s}</strong><p>${['依据你的回答，不预设起点','先看清要学什么','例子、图解与按需演示','用回答决定下一步'][i]}</p></div>`).join('')}</div><div class="rule" style="margin:20px 0"></div><div class="support-details">当前：<strong>${phaseName()}</strong><br>本记录诊断：${r.learning.answers.length} 个回答<br>同主题累计：${state.profile.attempts} 次检验<br>${state.profile.weakness?`待加强：${esc(state.profile.weakness)}`:'学习记录暂未发现薄弱点'}</div><button class="record-link" data-action="history">查看承接的交流历史 →</button>`;
if(state.mode==='organize')return `<div class="support-label">资料与模式是两条线</div><div class="support-details">${r.organizing.selected.length} 份已选材料<br>原文件留在示例笔记库中。整理方案由你选择后执行。</div><div class="rule" style="margin:20px 0"></div><div class="context-card"><div class="kicker">可以边运行边切换</div><p>开始整理后切到自由共写，模拟 Agent 仍会完成原来的这一轮。结果归回发起它的交互记录。</p></div><button class="record-link" data-action="history">查看交流历史 →</button>`;
return `<div class="support-label">页边协作</div>${historyView(5)}<div class="suggestion" style="margin-top:20px"><span class="tag">一个可继续的想法</span><p>“平均”与“瞬时”的区别，或许可以通过一个小例子说明。</p><button class="btn" data-action="suggest">加入这个例子</button></div><button class="record-link" data-action="history">完整交互记录 →</button>`}
function formatControls(){return `<div class="row spread"><div class="row"><span class="file-chip">▯ 函数与变化${state.format==='html'?'.html':'.md'}</span>${state.showFormat?`<div class="format-tabs"><button class="${state.format==='md'?'active':''}" data-action="format" data-id="md">MD</button><button class="${state.format==='html'?'active':''}" data-action="format" data-id="html" ${!state.html?'disabled':''}>HTML</button></div>`:''}</div><label class="inline-setting"><input type="checkbox" data-field="format-visible" ${state.showFormat?'checked':''}>Type</label></div>`}
function editor(){return `<section class="document-editor"><div class="editor-head grow">${formatControls()}</div>${state.format==='md'?`<textarea class="note-editor" aria-label="Markdown 笔记" data-field="markdown" spellcheck="false">${esc(state.markdown)}</textarea>`:`<iframe class="article-preview" title="按需生成的 HTML 文档" sandbox="" srcdoc="${esc(state.html)}"></iframe>`}<div class="editor-foot row spread"><span>示例文件 · 内存中的 MD v<span id="md-version">${state.mdVersion}</span>${state.html?` · HTML 来源 v${state.htmlSourceVersion}`:''}</span><span id="html-stale">${state.html&&state.mdVersion!==state.htmlSourceVersion?'HTML 保留旧版本，等待按需更新':'内容由你控制'}</span></div><div class="row" style="margin-top:13px;flex-wrap:wrap"><select aria-label="HTML 展示风格" data-field="html-style"><option ${state.htmlStyle==='纸与墨'?'selected':''}>纸与墨</option><option ${state.htmlStyle==='概念卡片'?'selected':''}>概念卡片</option></select><button class="btn" data-action="generate-html" ${state.run?.status==='running'?'disabled':''}>${state.html?'按最新 MD 更新 HTML':'按需生成 HTML'}</button>${state.html?'<button class="btn ghost" data-action="convert-md">从 HTML 生成 MD</button>':''}</div><p class="tiny muted" style="margin-top:9px">格式转换由预设程序模拟；没有连接真实模型或写入文件。</p></section>`}
function phaseBreadcrumb(){const names=['判断理解','确定范围','讲解知识','小测'];const keys=['diagnose','scope','lesson','quiz'];return `<div class="phase-breadcrumb">${names.map((n,i)=>`<span class="${record().learning.phase===keys[i]?'current':''}">${String(i+1).padStart(2,'0')} ${n}</span>${i<3?'<b>›</b>':''}`).join('')}</div>`}
const diagnosis=[{q:'f(x) = x²。输入从 2 变成 3，输出增加了多少？',opts:['1','5','6','还不确定'],answer:1},{q:'如果只看 x = 2 附近，f(x) = x² 的瞬时变化率是多少？',opts:['2','4','5','还不确定'],answer:1}];
function choices(opts,selected,action){return `<div class="questions">${opts.map((o,i)=>`<button class="option ${selected===i?'selected':''}" data-action="${action}" data-id="${i}" aria-pressed="${selected===i}"><span class="letter">${'ABCD'[i]}</span><span>${esc(o)}</span></button>`).join('')}</div>`}
function chart(){const l=record().learning,a=l.coefficient;const pts=Array.from({length:81},(_,i)=>{const x=-3+i*6/80;return `${210+x*55},${174-a*x*x*15}`}).join(' ');return `<div class="chart-box"><div class="row spread"><span class="tag">本次对话中加入的交互演示</span><span class="tiny muted">预设组件 · 模拟动态加入</span></div><svg class="chart" viewBox="0 0 420 195" role="img" aria-label="可调整参数的二次函数曲线"><g stroke="#edf0e8" stroke-width="1">${[45,100,155,210,265,320,375].map(x=>`<path d="M${x} 10V180"/>`).join('')}${[39,84,129,174].map(y=>`<path d="M25 ${y}H400"/>`).join('')}</g><path d="M25 174H400 M210 10V180" fill="none" stroke="#aab8a4"/><polyline id="curve" points="${pts}" fill="none" stroke="#52744b" stroke-width="2.5"/><text x="390" y="190" fill="#889681" font-size="11">x</text><text x="215" y="15" fill="#889681" font-size="11">y</text></svg><div class="params"><div><label>拖动参数，观察同一个输入对应的输出</label><input type="range" min="0.25" max="1.4" step="0.05" value="${a}" data-field="coefficient" aria-label="函数参数 a"></div><strong class="serif" id="formula-a">f(x) = ${a.toFixed(2)}x²</strong></div></div>`}
function learning(){const l=record().learning;let content='';
if(l.phase==='intro'){content=`<p class="question-title">你想从哪里开始理解？</p><label class="tiny muted" for="topic">学习主题（此原型使用函数示例）</label><input id="topic" data-field="topic" value="${esc(l.topic)}" style="width:100%;margin:9px 0 15px">${state.profile.attempts?`<div class="learning-memory"><strong>可以接着上次学习</strong><p>同一主题已完成 ${state.profile.attempts} 次检验，${state.profile.weakness?`待加强「${esc(state.profile.weakness)}」`:'此前小测已答对'}。</p><div class="row"><button class="btn primary" data-action="resume-learning">沿用记录继续</button><button class="btn" data-action="begin-diagnosis">重新判断理解</button></div></div>`:`<p class="muted" style="font-size:12px">先回答两个问题。你的回答会决定后面从哪里讲起；不知道也可以。</p><div class="stage-actions"><button class="btn primary" data-action="begin-diagnosis">开始判断当前理解 →</button></div>`}`}
if(l.phase==='diagnose'){const q=diagnosis[l.answers.length];content=`<div class="row spread"><span class="tag">判断理解 · ${l.answers.length+1} / 2</span><span class="tiny muted">回答后再决定范围</span></div><div class="question-title">${q.q}</div>${choices(q.opts,l.choice,'diagnostic-choice')}<div class="stage-actions"><button class="btn primary" data-action="diagnostic-submit" ${l.choice===null?'disabled':''}>继续 →</button></div>`}
if(l.phase==='scope'){const first=l.answers[0]?.correct,second=l.answers[1]?.correct;const start=first?(second?'连接几何直觉与应用':'从平均走向瞬时'):'从输入与输出的变化开始';content=`<span class="tag">${l.answers.length?`依据 ${l.answers.length} 个回答`:'参考此前学习记录'}</span><div class="question-title">${start}</div><p class="muted" style="font-size:12px">${first?(second?'你已掌握两个基本计算，我们可以用图像解释为什么。':'你能计算整段变化，接下来把区间一步步缩小。'):'先弄清楚两个输入之间发生了什么，再讨论一个点附近的变化。'}</p><div class="plan-item"><span class="plan-index">01</span><div><h3>${first?'平均变化率与瞬时变化率':'输入、输出与变化量'}</h3><p>从你的起点出发，用一个具体例子连接概念。</p></div></div><div class="plan-item"><span class="plan-index">02</span><div><h3>图像与切线的直觉</h3><p>需要时加入可以拖动参数的演示。</p></div></div><div class="plan-item"><span class="plan-index">03</span><div><h3>用小测检验理解</h3><p>回答决定下一步继续还是换一个解释。</p></div></div><div class="stage-actions"><button class="btn primary" data-action="lesson">按这个范围开始 →</button><button class="btn" data-action="begin-diagnosis">重新判断</button></div>`}
if(l.phase==='lesson'){content=`<span class="tag">知识点 01 / 变化率</span><div class="lesson-prose"><h2>把一段变化，慢慢缩成一个点</h2>${l.answers[0]?.correct===false?'<p>先看输入与输出：f(2) = 4，f(3) = 9。输入增加了 1，输出增加了 5；输出增加量和最后的输出值是两件事。</p>':''}${l.answers.every(a=>a.correct)&&l.answers.length?'<p>你已掌握基本计算。接下来用图像解释：为什么缩短区间，可以把一条割线变成切线？</p>':''}<p>x 从 2 到 3，f(x) 从 4 到 9。我们用输出变化除以输入变化，得到这段区间的平均变化率。</p><div class="formula">( 9 − 4 ) / ( 3 − 2 ) = 5</div><p>接着把终点往 2 靠近。两点之间的连线逐渐接近曲线在 x = 2 处的切线，斜率趋向 4。这就是那个点附近的瞬时变化率。</p></div>${l.demo?chart():`<div class="suggestion"><strong>想换一种理解方式？</strong><p>加入一个可以拖动参数的图像，观察曲线怎样变化。</p><button class="btn" data-action="add-demo">让 Agent 加入交互演示</button></div>`}<div class="stage-actions"><button class="btn primary" data-action="quiz">试一道小测 →</button><button class="btn" data-action="scope">查看学习范围</button></div>`}
if(l.phase==='quiz'){content=`<span class="tag">小测 · 提交后看反馈</span><div class="question-title">f(x) = x²，在 x = 3 处的瞬时变化率是多少？</div>${choices(['3','6','9','还不确定'],l.quizChoice,'quiz-choice')}${l.quizFeedback?`<div class="answer-feedback ${l.quizFeedback.correct?'':'wrong'}"><strong>${l.quizFeedback.correct?'答对了，接下来可以把这个理解用于新例子。':'这里还有一个需要连接的地方。'}</strong><p style="margin-top:7px">${l.quizFeedback.correct?'f′(x) = 2x，所以 x = 3 时变化率为 6。':'瞬时变化率不是输出 f(3) = 9。f′(x) = 2x，因此这个点附近的变化率是 6。'}</p></div>`:''}<div class="stage-actions">${l.quizFeedback?`<button class="btn primary" data-action="${l.quizFeedback.correct?'review':'lesson'}">${l.quizFeedback.correct?'保留学习记录 →':'回到图像，换一种理解 →'}</button>`:`<button class="btn primary" data-action="quiz-submit" ${l.quizChoice===null?'disabled':''}>提交回答</button>`}</div>`}
if(l.phase==='review'){content=`<span class="tag">本次学习已记录</span><div class="question-title">从一个计算，走到一个理解。</div><div class="result-list"><div>✓ 判断了你对平均与瞬时变化率的理解</div><div>✓ 按起点展开讲解${l.demo?'，加入了交互图像':''}</div><div>✓ 小测 ${l.quizFeedback?.correct?'已答对':'已记录待加强点'}</div></div><p class="muted" style="font-size:12px;margin-top:17px">新开交流后选择自适应学习，可以参考这份记录。这里只在本次浏览器页面内保留。</p><div class="stage-actions"><button class="btn primary" data-action="new-learning">新聊天，继续这个主题</button><button class="btn" data-action="mode" data-id="write">切到自由共写</button></div>`}
return `<div class="learning-flow">${l.phase!=='intro'?phaseBreadcrumb():''}${content}</div>`}
function organizing(){const o=record().organizing;let body='';
if(o.phase==='sources'){body=`<div class="source-header row spread"><div><span class="kicker">先看清材料</span><h2 style="margin-top:6px">${state.files.length} 份笔记，一组关联</h2></div><span class="tag">仅示例文件</span></div>${state.files.map((f,i)=>`<label class="source-item"><input type="checkbox" data-field="source" data-id="${i}" ${o.selected.includes(i)?'checked':''}><div class="document-icon">≋</div><div class="grow"><h3>${esc(f.title)}</h3><p>${esc(f.summary)}</p></div></label>`).join('')}<div class="stage-actions"><button class="btn primary" data-action="organize-plan" ${!o.selected.length?'disabled':''}>让 Agent 提出整理方案 →</button></div>`}
if(o.phase==='plan'){body=`<span class="tag">方案已提出，选择你需要的操作</span><h2 style="margin:17px 0">把散落的片段，连成清晰的结构</h2><p class="muted" style="font-size:12px;margin-bottom:13px">这次示例只调整文件位置，正文内容保留。你可以逐项选择。</p>${o.selected.map(i=>`<label class="change-row"><input type="checkbox" data-field="approve" data-id="${i}" ${o.approved.includes(i)?'checked':''}><span class="before">${esc(state.files[i].title)}</span><span class="arrow muted">→</span><span class="after">${esc(state.files[i].after)}</span></label>`).join('')}<div class="stage-actions"><button class="btn primary" data-action="organize-execute" ${!o.approved.length||state.run?.status==='running'?'disabled':''}>执行选定的 ${o.approved.length} 项操作</button><button class="btn" data-action="organize-back">回到材料</button></div><p class="tiny muted" style="margin-top:11px">开始后试着换一个模式，原模拟 Agent 会继续执行。</p>`}
if(o.phase==='running'){body=`<span class="tag warm">执行中 · 模拟 Agent</span><h2 style="margin:20px 0">正在整理你选定的材料</h2><div class="result-list">${o.approved.map(i=>`<div>${(state.run?.progress||0)>(i+1)*25?'✓':'◌'} ${esc(state.files[i].after)}</div>`).join('')}</div><div class="stage-actions"><button class="btn primary" data-action="mode" data-id="write">切到自由共写，继续运行 →</button></div><p class="tiny muted" style="margin-top:15px">这里的执行只改变原型的内存状态。</p>`}
if(o.phase==='done'){body=`<span class="tag">整理完成</span><h2 style="margin:17px 0">这次整理，留在同一份交流记录里</h2><div class="result-list">${o.result.map(x=>`<div>✓ ${esc(x)}</div>`).join('')}</div><p class="muted" style="font-size:12px;margin-top:16px">即使中途切换了模式，原来的 Agent 仍完成了这一轮。结果没有跟随页面消失。</p><div class="stage-actions"><button class="btn" data-action="history">回看过程</button><button class="btn primary" data-action="mode" data-id="write">回到共写 →</button></div>`}
return `<div class="organizing-flow">${body}</div>`}
function declaredMode(def,preview=false){return `<div class="declared-workspace"><span class="tag">${preview?'模式草稿 · 可操作预览':'自定义模式 · 内存安装'}</span><h2 style="margin:15px 0">${esc(def.name)}</h2>${def.blocks.map(b=>{if(b.kind==='compare')return `<div class="compare-grid"><div class="compare-block"><h3>${esc(b.left)}</h3><p>用区间变化解释平均变化率，直观且便于计算。</p><p>先有整体认识，再逐步缩小区间。</p></div><div class="compare-block"><h3>${esc(b.right)}</h3><p>一个区间的平均值，是否能说明某一个点？</p><p>你如何解释从 5 逐渐趋向 4？</p></div></div>`;if(b.kind==='source')return `<div class="context-card"><div class="kicker">当前资料</div><p>${esc(state.markdown.split('\n').filter(x=>x&&!x.startsWith('#'))[0])}</p></div>`;if(b.kind==='outline')return `<div class="plan-item"><span class="plan-index">01</span><div><h3>${esc(b.title)}</h3><p>看原文 → 表达理解 → 等待反馈 → 保留自己的观点</p></div></div>`;if(b.kind==='question')return `<div class="custom-question"><label>${esc(b.text)}</label><textarea data-field="custom-answer" aria-label="自定义模式回答" placeholder="用你自己的话回答…">${esc(preview?(state.previewAnswer||''):record().customAnswer)}</textarea><button class="btn primary" data-action="custom-reply" data-preview="${preview}">提交回答</button><div id="${preview?'draft':'custom'}-feedback"></div></div>`;return''}).join('')}<p class="custom-note">本原型使用预设解析来演示创建流程；没有真实 Agent 编写代码。</p></div>`}
function primaryContent(){if(state.mode==='write')return editor();if(state.mode==='learn')return learning();if(state.mode==='organize')return organizing();return declaredMode(mode())}
function VariantA(){return `<div class="scene variant-a">${appbar(false)}<div style="padding:0 24px;background:var(--paper)">${runStrip()}</div><div class="desk"><aside class="rail"><div class="side-label">交互模式</div>${modeButtons()}<div class="side-label">资料 <span>3</span></div>${library()}<div class="work-relation">同一份资料，可以切换不同模式。</div><div class="side-label">交互记录 <button data-action="new-record">＋</button></div>${recordLinks()}<div style="margin-top:22px"><button class="btn" data-action="creator" style="width:100%">◇ 创建自己的模式</button></div></aside><main class="workspace">${heading()}${primaryContent()}${state.mode==='write'?prompt():''}</main><aside class="support-panel">${support()}</aside></div>${ribbon()}</div>`}
function VariantB(){const r=record();return `<div class="scene variant-b" data-mode="${esc(state.mode)}">${appbar(true)}<div class="workspace">${heading()}<div class="mini-run">${runStrip()}</div><main class="stage-surface ${state.mode==='organize'?'organizer-surface':''}">${primaryContent()}${state.mode==='write'?`<aside><div class="support-label">这一页的协作</div>${historyView(3)}<div style="margin-top:22px" class="suggestion"><p>从一个具体例子继续。</p><button class="btn" data-action="suggest">加入例子</button></div></aside>`:''}</main>${state.mode==='write'?prompt():''}</div><div class="context-tray"><div class="tray-cell"><h3>当前材料</h3><div class="compact-sources">${state.files.map(f=>`<div>▯ ${esc(f.title)}</div>`).join('')}</div></div><div class="tray-cell"><h3>这次交流 · #${r.id}</h3><p class="tiny muted">${r.messages.length} 条过程记录。换模式后仍承接历史。</p><button class="rail-toggle" data-action="history" style="margin-top:9px">展开交互记录 →</button></div><div class="tray-cell"><h3>${state.mode==='learn'?'学习线索':'模式可以由你定义'}</h3><p class="tiny muted">${state.mode==='learn'?`当前是「${phaseName()}」。同主题已有 ${state.profile.attempts} 次检验。`:'描述页面怎样组合、怎样提问、何时等待，在预览里体验新的协作方式。'}</p><button class="rail-toggle" data-action="creator" style="margin-top:9px">创建或修改模式 →</button></div></div>${ribbon()}</div>`}
function boardCard(id){const title={sources:'资料 · 同一批文件',main:'当前交互 · 随阶段改变',history:'交流记录 · 持续承接',context:'工作线索 · 可选模组'}[id];let content=id==='sources'?`${library()}<div class="rule" style="margin:17px 0"></div><div class="support-details">文件与模式独立<br>▱ 个人笔记库</div>`:id==='main'?`${heading()}${primaryContent()}${state.mode==='write'?`<div style="margin-top:22px">${prompt()}</div>`:''}`:id==='history'?`${historyView(10)}<div style="margin-top:12px">${recordLinks()}</div>`:support();return `<section class="board-card" data-card="${id}"><div class="card-handle" draggable="true" data-drag="${id}"><span>⠿　${title}</span><button data-action="move-card" data-id="${id}" title="移动到下一列" aria-label="移动${title}到下一列">↗</button></div><div class="card-body">${content}</div></section>`}
function VariantC(){return `<div class="scene variant-c">${appbar(false)}<div class="board-header"><div><h1>你的工作台，围绕现在这件事。</h1><p>拖动面板到另一列；切换模式会改变主交互面板的功能。</p></div><div class="board-mode-menu">${modeButtons()}</div></div><div style="padding:0 27px 16px">${runStrip()}</div><div class="board">${state.board.map((cards,i)=>`<div class="board-column" data-column="${i}">${cards.map(boardCard).join('')}</div>`).join('')}</div><div class="board-foot">每一个区域是可组合的界面位置。这里用拖动探索布局，所有状态仅存在本次原型中。</div>${ribbon()}</div>`}
function render(){const scroll=window.scrollY,focus=focusedSnapshot(),key=[state.variant,state.mode,state.recordId,record().learning.phase,record().learning.demo,state.format].join('/'),before=[...document.querySelectorAll('[data-card]')].map(el=>[el.dataset.card,el.getBoundingClientRect()]);$('#app').innerHTML=state.variant==='A'?VariantA():state.variant==='B'?VariantB():VariantC();$('#switcher').innerHTML=`<button data-action="variant-prev" aria-label="上一个界面方向">←</button><div class="variant-label">${state.variant} · ${variants[state.variant]}<span>原型</span></div><button data-action="variant-next" aria-label="下一个界面方向">→</button><div class="variant-dots">${Object.keys(variants).map(v=>`<button data-action="variant" data-id="${v}" class="${state.variant===v?'active':''}" aria-label="方向 ${v}">${v}</button>`).join('')}</div>`;renderModal();restoreFocus(focus);window.scrollTo(0,scroll);if(renderKey&&key!==renderKey)surfaceMotion($('.stage-surface')||$('.workspace')||$('.board-card[data-card=main]'));else if(state.variant==='C'&&!reduced()&&lastInput!=='keyboard')for(const[id,old]of before){const el=$(`[data-card="${id}"]`);if(!el)continue;const now=el.getBoundingClientRect(),dx=old.left-now.left,dy=old.top-now.top;if(Math.abs(dx)+Math.abs(dy)>3)el.animate([{transform:`translate(${dx}px,${dy}px)`},{transform:'translate(0,0)'}],{duration:220,easing:'cubic-bezier(0.77,0,0.175,1)'})}renderKey=key}
function modalShell(title,sub,content){return `<dialog class="dialog" aria-label="${title}" data-action="overlay-close"><div class="dialog-head"><div><h2>${title}</h2><p>${sub}</p></div><button class="btn ghost" data-action="close" aria-label="关闭">✕</button></div><div class="dialog-body">${content}</div></dialog>`}
function renderModal(){let html='';if(state.modal==='history')html=modalShell('这段交流，没有随页面消失',`记录 #${record().id} · ${record().messages.length} 条 · 所有回复为模拟`,`${recordLinks()}<div style="margin-top:20px">${historyView(100)}</div>`);
if(state.modal==='state'){const r=record(),run=state.run;html=modalShell('观察原型状态','这里显示与设计问题有关的完整状态；切换界面方向不会清空它。',`<dl class="state-grid"><div class="state-field"><dt>界面与模式</dt><dd>方向 ${state.variant} · ${variants[state.variant]}<br>模式 ${esc(mode().name)}<br>Type 入口 ${state.showFormat?'显示':'隐藏'} · 当前格式 ${state.format.toUpperCase()}</dd></div><div class="state-field"><dt>交互记录</dt><dd>当前 #${r.id} · ${r.messages.length} 条<br>共 ${state.records.length} 份记录<br>最后操作：${esc(state.lastAction)}</dd></div><div class="state-field"><dt>文件与来源关系</dt><dd>MD v${state.mdVersion}<br>HTML ${state.html?`来源 MD v${state.htmlSourceVersion} · ${state.htmlStyle}`:'尚未生成'}<br>${state.html&&state.mdVersion!==state.htmlSourceVersion?'MD 已修改，HTML 默认未更新':'无需同步更新'}</dd></div><div class="state-field"><dt>Agent 运行与归属</dt><dd>${run?`运行 #${run.id} · ${esc(state.modes.find(m=>m.id===run.mode)?.name)}<br>发起记录 #${run.recordId}<br>${run.status} · ${run.progress}%<br>当前模式 ${esc(mode().name)}`:'当前没有运行'}</dd></div><div class="state-field"><dt>学习与同主题记录</dt><dd>阶段 ${phaseName()}<br>当前诊断 ${r.learning.answers.map(a=>a.correct?'✓':'待加强').join(' / ')||'未开始'}<br>当前演示 ${r.learning.demo?'已加入':'未加入'} · 参数 ${r.learning.coefficient}<br>累计检验 ${state.profile.attempts} · 正确 ${state.profile.correct}<br>薄弱点 ${esc(state.profile.weakness||'未记录')}</dd></div><div class="state-field"><dt>资料整理</dt><dd>阶段 ${r.organizing.phase}<br>选中材料 ${r.organizing.selected.map(i=>state.files[i].title).join('、')}<br>选定操作 ${r.organizing.approved.length} 项<br>已产生结果 ${r.organizing.result.length} 项</dd></div><div class="state-field"><dt>已安装模式与草稿</dt><dd>${state.modes.map(m=>esc(m.name)).join('、')}<br>草稿 ${state.draft?esc(state.draft.name):'无'}<br>所有定义仅在内存中</dd></div><div class="state-field"><dt>自由工作台组合</dt><dd>${state.board.map((c,i)=>`第 ${i+1} 列：${c.join('、')||'空'}`).join('<br>')}</dd></div><div class="state-field wide"><dt>所有交互记录与运行归属</dt><dd><ul>${state.records.map(x=>`<li>#${x.id} · ${esc(x.title)} · ${esc(state.modes.find(m=>m.id===x.mode)?.name||x.mode)} · ${x.messages.length} 条</li>`).join('')}</ul></dd></div></dl>`)}
if(state.modal==='creator')html=modalShell('描述一种你想要的协作方式','可操作的创建与预览流程。此处使用示例解析，未调用真实模型。',`<div class="dialog-grid"><div class="stack"><div><div class="kicker">让 Agent 了解共笔</div><div class="context-card" style="margin-top:9px"><p>已提供：当前资料、模式接口示例、可选的原文 / 对照 / 提问 / 等待回答模组。</p></div></div><label class="stack"><strong style="font-size:12px">你想让模式怎样工作？</strong><textarea rows="6" data-field="draft-request" aria-label="模式创建需求">${esc(state.draftRequest)}</textarea></label><div class="examples"><button data-action="example" data-id="debate">对照辩论</button><button data-action="example" data-id="close-read">逐句精读</button><button data-action="example" data-id="review">每周回顾</button></div><button class="btn primary" data-action="build-draft">${state.draft?'按描述调整预览':'生成模式预览'} →</button><p class="tiny muted">预览不会替换当前模式，提交回答可以体验“等待 → 回传 → 反馈”。</p></div><div><div class="preview-window"><div class="preview-top"><span>可操作预览</span><span>${state.draft?'草稿':'等待生成'}</span></div><div class="preview-body">${state.draft?declaredMode(state.draft,true):'<div class="empty">描述需求后，新的交互结构会出现在这里。<br>它可以调用内置模组，也可以有自己的界面。</div>'}</div></div>${state.draft?'<div class="draft-foot"><button class="btn primary" data-action="install-draft">使用这个模式</button><span class="tiny muted">只在原型中安装，可继续修改</span></div>':''}</div></div>`);
if(state.modal==='guide')html=modalShell('三条体验路径','任选一条开始，也可以随时自由切换模式和界面方向。',`<div class="guide-list"><div class="guide"><span class="tag">01 / 页面自适应</span><h3 style="margin-top:12px">从问题，到理解</h3><p>不同阶段应让你做不同的事情。</p><ol><li>回答两个诊断问题</li><li>查看依回答变化的学习范围</li><li>加入图像并拖动参数</li><li>小测后新开交流，沿用记录</li></ol><button class="btn primary" data-action="guide-start" data-id="learn">开始学习体验 →</button></div><div class="guide"><span class="tag">02 / 工作连续性</span><h3 style="margin-top:12px">界面换了，Agent 继续</h3><p>交流记录与运行不依赖当前页面。</p><ol><li>选择资料并生成方案</li><li>执行选定的整理操作</li><li>中途切到自由共写</li><li>查看原 Agent 的完成结果</li></ol><button class="btn primary" data-action="guide-start" data-id="organize">开始整理体验 →</button></div><div class="guide"><span class="tag">03 / 用户定义模式</span><h3 style="margin-top:12px">先体验，再采用</h3><p>用不同界面与流程处理相同资料。</p><ol><li>描述“对照辩论”模式</li><li>生成并体验提问预览</li><li>调整描述，再生成预览</li><li>使用模式，保留已有记录</li></ol><button class="btn primary" data-action="creator">开始创建体验 →</button></div></div>`);
const host=$('#modal'),existing=host.querySelector('dialog');clearTimeout(modalExitTimer);if(!html){if(existing?.open){if(lastInput==='keyboard'){existing.close();host.innerHTML='';document.body.style.overflow=''}else{existing.classList.add('closing');modalExitTimer=setTimeout(()=>{if(!state.modal){existing.close();host.innerHTML='';document.body.style.overflow=''}},reduced()?160:170)}}return}if(existing?.open){const next=new DOMParser().parseFromString(html,'text/html').querySelector('dialog');existing.innerHTML=next.innerHTML;existing.setAttribute('aria-label',next.getAttribute('aria-label'));existing.classList.remove('closing')}else{host.innerHTML=html;host.querySelector('dialog').showModal()}document.body.style.overflow='hidden'}
function setMode(id){if(!state.modes.some(m=>m.id===id))return;const old=mode().name;state.mode=id;record().mode=id;addMessage('system',`从「${old}」切到「${mode().name}」，保留此前交流历史。${state.run?.status==='running'?'之前的模拟 Agent 继续运行。':''}`);changed(`切换到 ${mode().name}。`)}
function switchVariant(v){state.variant=v;const u=new URL(location.href);u.searchParams.set('variant',v);historyReplace(u);changed(`界面换成「${variants[v]}」，模式、历史、文件与运行状态保留。`,true);window.scrollTo(0,0)}
function historyReplace(u){window.history.replaceState({},'',u)}
function startRun(kind){if(state.run?.status==='running'){toast('已有一轮在运行，可以先等待或停止。');return}const owner=record(),id=state.nextRun++;state.run={id,kind,mode:state.mode,recordId:owner.id,status:'running',progress:0,label:kind==='organize'?'资料整理正在执行':'正在生成 HTML',approved:[...owner.organizing.approved],snapshot:state.markdown,sourceVersion:state.mdVersion,style:state.htmlStyle};if(kind==='organize')owner.organizing.phase='running';addMessage('agent',kind==='organize'?`开始执行 ${owner.organizing.approved.length} 项选定的整理操作。`:'按描述生成 HTML，原 MD 保留。',owner);changed('模拟 Agent 开始运行。');runTimer=setInterval(()=>{if(state.run?.id!==id||state.run.status!=='running'){clearInterval(runTimer);return}state.run.progress=Math.min(100,state.run.progress+(kind==='organize'?8:25));if(state.run.progress===100){clearInterval(runTimer);completeRun()}else{document.querySelectorAll('.run-strip').forEach(el=>{const text=el.querySelectorAll('span')[1];text.textContent=`${state.run.label} ${state.run.progress}%${state.run.mode!==state.mode?' · 原模式继续运行':''}`;const p=el.querySelector('progress');if(p)p.value=state.run.progress});if(state.modal==='state')renderModal()}},kind==='organize'?800:650)}
function makeHTML(text,style){const lines=text.split('\n').filter(Boolean);const body=lines.map(line=>line.startsWith('# ')?`<h1>${esc(line.slice(2))}</h1>`:line.startsWith('## ')?`<h2>${esc(line.slice(3))}</h2>`:line.startsWith('- [ ]')?`<p class="task">□ ${esc(line.slice(6))}</p>`:`<p>${esc(line)}</p>`).join('');return `<!doctype html><html lang="zh"><meta charset="utf-8"><style>body{margin:0;padding:28px 30px;background:${style==='纸与墨'?'#fbfaf5':'#edf2e8'};color:#314237;font:15px/1.9 ${style==='纸与墨'?'Georgia,"Songti SC",serif':'-apple-system,"PingFang SC",sans-serif'}}h1{font-size:27px;line-height:1.5;font-weight:500;margin:0 0 18px}h2{font-size:18px;margin-top:24px}p{margin:13px 0}${style==='概念卡片'?'p{background:white;border:1px solid #d9e3d2;padding:14px 16px;border-radius:10px}':''}.task{font-size:13px;color:#708168}</style><body>${body}<p style="font:10px sans-serif;color:#a0aa99;margin-top:25px">原型中的模拟转换 · ${style}</p></body></html>`}
function completeRun(){const run=state.run,owner=state.records.find(r=>r.id===run.recordId);run.status='done';if(run.kind==='organize'){owner.organizing.result=run.approved.map(i=>`${state.files[i].title} → ${state.files[i].after}`);owner.organizing.phase='done';addMessage('agent',`选定的 ${run.approved.length} 项操作已完成。${run.mode!==state.mode?'这轮执行没有被模式切换打断。':''}`,owner,run.mode)}else{state.html=makeHTML(run.snapshot,run.style);state.htmlSourceVersion=run.sourceVersion;state.format='html';addMessage('agent',`已生成「${run.style}」HTML，来源是 MD v${run.sourceVersion}。后续按你的要求更新。`,owner,run.mode)}changed(`原模拟 Agent 已完成，结果保留在记录 #${owner.id}。`,true)}
function buildDraft(){const req=state.draftRequest;const name=(req.match(/[「“](.+?)[」”]/)||[])[1]||(req.includes('精读')?'逐句精读':req.includes('回顾')?'每周回顾':'我的协作模式');let blocks=req.includes('辩论')||req.includes('反方')||req.includes('对照')?[{kind:'compare',left:'支持这个观点',right:'换一个角度质疑'},{kind:'question',text:'你更认同哪一边？请用一个例子说明。'}]:[{kind:'source'},{kind:'outline',title:req.includes('回顾')?'从一周的材料开始':'从这段原文开始'},{kind:'question',text:req.includes('回顾')?'这周哪一个理解发生了变化？':'用你自己的话解释这段原文，哪里还不确定？'}];if(req.includes('原文')&&blocks[0].kind!=='source')blocks.unshift({kind:'source'});state.draft={id:state.draft?.id||`custom-${Date.now()}`,name,summary:'你定义的页面、提问与等待方式。',blocks,request:req};state.previewAnswer='';changed('已生成可操作的模式草稿。');surfaceMotion($('.preview-body'))}
function action(name,id,el){const r=record(),l=r.learning,o=r.organizing;
switch(name){
case'variant':switchVariant(id);break;case'variant-prev':case'variant-next':{const list=Object.keys(variants),offset=name==='variant-next'?1:-1;switchVariant(list[(list.indexOf(state.variant)+offset+3)%3]);break}
case'mode':setMode(id);break;
case'new-record':case'new-learning':{const m=name==='new-learning'?'learn':state.mode;const next=newRecord(state.nextRecord++,m);state.records.push(next);state.recordId=next.id;state.mode=m;changed(`新开记录 #${next.id}。历史保留，同主题学习记录可参考。`,true);break}
case'record':{const target=state.records.find(x=>x.id===Number(id));state.recordId=target.id;state.mode=target.mode;changed(`回到记录 #${target.id}。`);break}
case'owner':if(state.run){const owner=state.records.find(x=>x.id===state.run.recordId);state.recordId=owner.id;state.mode=owner.mode;changed(`回到运行发起记录 #${owner.id}。`)}break;
case'stop':clearInterval(runTimer);if(state.run){state.run.status='stopped';const owner=state.records.find(x=>x.id===state.run.recordId);if(state.run.kind==='organize')owner.organizing.phase='plan';addMessage('system','用户主动停止了这一轮模拟 Agent。',owner);changed('运行已由你主动停止。',true)}break;
case'suggest':state.markdown+='\n\n例如：想象汽车走过一段路，平均速度描述整段路程；某一瞬间的速度，则对应瞬时变化率。';state.mdVersion++;addMessage('user','用一个具体例子解释平均与瞬时的区别。');addMessage('agent','已把一个汽车速度的例子加入示例笔记。');changed('例子已加入 MD，已有 HTML 保留原样。',true);break;
case'send':{const field=$('[data-field=prompt]'),text=field?.value.trim();if(!text)return;field.value='';r.promptDraft='';addMessage('user',text);addMessage('agent',state.mode==='write'?'可以从当前笔记继续。这里模拟一条基于上下文的回复：把“输入怎样变化”与“输出怎样变化”放在一起看，再用例子验证理解。':'我会依据当前阶段继续这段交流。此原型中的回答是示例响应。');changed('这条交流已加入当前记录。');break}
case'format':if(id==='html'&&!state.html)return;state.format=id;changed(`切到 ${id.toUpperCase()}，文件版本保留。`);break;
case'generate-html':addMessage('user',`请把这篇 MD 生成「${state.htmlStyle}」风格的 HTML。`);startRun('html');break;
case'convert-md':{const doc=new DOMParser().parseFromString(state.html,'text/html');state.markdown=[...doc.body.children].filter(e=>!e.textContent.includes('原型中的模拟转换')).map(e=>e.tagName==='H1'?'# '+e.textContent:e.tagName==='H2'?'## '+e.textContent:e.classList.contains('task')?'- [ ] '+e.textContent.replace(/^□\s*/,''):e.textContent).join('\n\n');state.mdVersion++;state.format='md';addMessage('user','从现有 HTML 生成 MD。');addMessage('agent','已在原型内转换主要文本和标题；页面布局没有转成 Markdown。');changed('已从 HTML 生成 MD（模拟转换）。',true);break}
case'begin-diagnosis':l.phase='diagnose';l.answers=[];l.choice=null;l.quizFeedback=null;addMessage('user',`我想学习「${l.topic}」，先判断我现在理解到哪里。`);addMessage('agent','先回答两个问题，再依据回答确定范围。');changed('进入诊断页面。');break;
case'diagnostic-choice':l.choice=Number(id);changed('已选择回答，提交后进入下一步。');break;
case'diagnostic-submit':{if(l.choice===null)return;const q=diagnosis[l.answers.length],answer={choice:l.choice,correct:l.choice===q.answer};l.answers.push(answer);addMessage('user',`${q.q} 我的回答：${q.opts[l.choice]}`);l.choice=null;if(l.answers.length===2){l.phase='scope';addMessage('agent',`依据两个回答，${l.answers.every(x=>x.correct)?'先连接几何直觉与应用':l.answers[0].correct?'从平均变化率走向瞬时变化率':'先讲清输入、输出和变化量'}。`)}changed(l.phase==='scope'?'回答改变了后续学习范围。':'进入第二个诊断问题。');break}
case'resume-learning':l.phase='scope';l.answers=state.profile.weakness?[{correct:true},{correct:false}]:[{correct:true},{correct:true}];addMessage('user','参考上次的学习记录继续。');addMessage('agent',`沿用此前理解，${state.profile.weakness?'再解释平均与瞬时的连接':'用一个新例子继续检验'}。`);changed('已承接同主题的学习记录。',true);break;
case'scope':l.phase='scope';changed('查看当前学习范围。');break;
case'lesson':l.phase='lesson';if(l.quizFeedback&&!l.quizFeedback.correct)l.demo=true;addMessage('agent','用平均变化率逐步趋向瞬时变化率的例子展开讲解。');changed('页面从规划切到知识讲解。');break;
case'add-demo':l.demo=true;addMessage('user','给我一个可以拖动参数的图像。');addMessage('agent','在当前页面加入二次函数演示。拖动 a，可以观察曲线的变化。');changed('在当前过程加入了交互演示（预设组件）。',true);break;
case'quiz':l.phase='quiz';l.quizChoice=null;l.quizFeedback=null;changed('切换到独立作答区域。');break;
case'quiz-choice':if(l.quizFeedback)return;l.quizChoice=Number(id);changed('已选择小测回答。');break;
case'quiz-submit':{if(l.quizChoice===null||l.quizFeedback)return;const correct=l.quizChoice===1;l.quizFeedback={correct};state.profile.attempts++;state.profile.correct+=correct?1:0;state.profile.weakness=correct?'':'平均与瞬时变化率';addMessage('user',`小测回答：${['3','6','9','还不确定'][l.quizChoice]}`);addMessage('agent',correct?'答对。可以把这个理解用于新的例子。':'先回到图像，补充瞬时变化率与输出值的区别。');changed('小测结果已影响下一步并保留为学习记录。',true);break}
case'review':l.phase='review';changed('本次学习记录可供下一段交流参考。');break;
case'organize-plan':o.phase='plan';o.approved=[...o.selected];addMessage('user',`帮我整理选定的 ${o.selected.length} 份材料，先给方案。`);addMessage('agent','建议将课堂片段放到课堂目录，概念与切线说明放到概念目录。请选择要执行的操作。');changed('页面从材料清单切到方案选择。');break;
case'organize-back':o.phase='sources';changed('回到资料选择。');break;
case'organize-execute':addMessage('user',`执行我选定的 ${o.approved.length} 项操作。`);startRun('organize');break;
case'creator':state.modal='creator';if(mode().blocks){state.draft={...mode(),blocks:mode().blocks.map(b=>({...b}))};state.draftRequest=mode().request}else{state.draft=null}changed('打开模式创建与可操作预览。');break;
case'build-draft':buildDraft();break;
case'example':state.draftRequest=id==='debate'?'做一个「对照辩论」模式：左边给出支持观点，右边给出反方质疑。一次只问我一个问题，等我回答后再继续。':id==='close-read'?'做一个「逐句精读」模式：先显示原文，再让我用自己的话解释，一次只处理一段，等我回答后反馈。':'做一个「每周回顾」模式：先看资料，列出本周的理解变化，再问我最想继续的一个问题。';state.draft=null;changed('已填入示例需求。');break;
case'install-draft':if(!state.draft)return;{const existing=state.modes.findIndex(m=>m.id===state.draft.id);if(existing<0)state.modes.push({...state.draft});else state.modes[existing]={...state.draft}}state.modal=null;setMode(state.draft.id);toast('模式已在原型内安装；已有交流历史保留。');break;
case'custom-reply':{const preview=el.dataset.preview==='true';const scope=preview?$('.preview-body'):$('.declared-workspace');const answer=scope.querySelector('[data-field=custom-answer]').value.trim();if(!answer)return;const target=$(`#${preview?'draft':'custom'}-feedback`);target.innerHTML=`<div class="answer-feedback"><strong>回答已回传，等待环节结束。</strong><p style="margin-top:5px">你的观点是「${esc(answer)}」。接下来可以尝试：用一个不同的输入区间，检验这个解释。</p><span class="tiny muted">模拟反馈</span></div>`;if(!preview){r.customAnswer=answer;addMessage('user',answer);addMessage('agent','回答已回传。用另一个区间检验这个观点。');state.lastAction='自定义模式中的回答进入原交互记录。';$('.state-ribbon').outerHTML=ribbon()}toast(preview?'预览中的等待与反馈已完成，当前记录未被改动。':'回答已保留在当前交流记录。');break}
case'move-card':{const from=state.board.findIndex(col=>col.includes(id));state.board[from]=state.board[from].filter(c=>c!==id);state.board[(from+1)%3].push(id);changed('工作台面板已移动，互动状态保留。');break}
case'history':state.modal='history';renderModal();break;case'state':state.modal='state';renderModal();break;case'guide':state.modal='guide';renderModal();break;
case'guide-start':state.modal=null;setMode(id);break;
case'close':state.modal=null;renderModal();break;case'overlay-close':state.modal=null;renderModal();break;
case'reset':clearInterval(runTimer);state=makeState();changed('原型状态已重置。',true);break;
}}
document.addEventListener('pointerdown',()=>{lastInput='pointer';delete document.body.dataset.keyboard});
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el||el.disabled)return;if(e.detail===0){lastInput='keyboard';document.body.dataset.keyboard='true'}if(el.dataset.action==='overlay-close'&&e.target!==el)return;action(el.dataset.action,el.dataset.id,el)});
document.addEventListener('cancel',e=>{if(e.target.tagName==='DIALOG'){e.preventDefault();state.modal=null;renderModal()}},true);
document.addEventListener('input',e=>{const el=e.target,key=el.dataset.field;if(key==='markdown'){state.markdown=el.value;state.mdVersion++;state.lastAction='修改了 MD，已有 HTML 默认保留原样。';$('#md-version').textContent=state.mdVersion;$('#html-stale').textContent=state.html?'MD 已修改，HTML 等待按需更新':'内容由你控制';$('.state-ribbon').outerHTML=ribbon()}if(key==='prompt')record().promptDraft=el.value;if(key==='draft-request')state.draftRequest=el.value;if(key==='topic')record().learning.topic=el.value;if(key==='custom-answer'){if(el.closest('.preview-body'))state.previewAnswer=el.value;else record().customAnswer=el.value;}if(key==='coefficient'){record().learning.coefficient=Number(el.value);const a=Number(el.value);$('#curve').setAttribute('points',Array.from({length:81},(_,i)=>{const x=-3+i*6/80;return `${210+x*55},${174-a*x*x*15}`}).join(' '));$('#formula-a').textContent=`f(x) = ${a.toFixed(2)}x²`;state.lastAction=`拖动图像参数 a = ${a.toFixed(2)}，其余交互状态保留。`}});
document.addEventListener('change',e=>{const el=e.target,key=el.dataset.field,r=record();if(key==='format-visible'){state.showFormat=el.checked;changed(el.checked?'显示 MD / HTML 切换入口。':'已隐藏格式切换入口。')}if(key==='html-style')state.htmlStyle=el.value;if(key==='source'||key==='approve'){const prop=key==='source'?'selected':'approved',i=Number(el.dataset.id);r.organizing[prop]=el.checked?[...new Set([...r.organizing[prop],i])]:r.organizing[prop].filter(x=>x!==i);changed('已调整这次要处理的材料或操作。')}});

render();
